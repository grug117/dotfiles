# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

$font = Monospace

general {
    hide_cursor = false
    ignore_empty_input = true
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = false
	#bezier = linear, 1, 1, 0, 0
	#animation = fadeIn, 1, 5, linear
	#animation = fadeOut, 1, 5, linear
	#animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $HOME/Pictures/Wallpapers/wallpaper.jpg
    blur_passes = 1
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = $font

    position = 0, 250
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font

    position = 0, 150
    halign = center
    valign = center
}

# USERNAME
label {
    monitor =
    text = Password for $USER
    font_size = 12
    font_familty = $font
    position = 0, 50
    haligh = center
    valign = center
}

input-field {
    monitor =
    size = 30%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(211, 211, 211, 1) rgba(211, 211, 211, 1) 45deg
    check_color = rgba(255, 165, 0, 1) rgba(255, 165, 0, 1) 120deg
    fail_colo = rgba(255, 0, 0, 1) rgba(255, 0, 0, 1) 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 2

    font_family = $font
#placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL

    # uncomment if you wish to display a message during authentication
    check_text = Authenticating...

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[en,gb]
    font_size = 24
    onclick = hyprctl switchxkblayout all next

    position = 0, 30
    halign = center
    valign = bottom
}
