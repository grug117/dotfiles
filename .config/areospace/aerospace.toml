# =========================================================
# AeroSpace - Minimal Hyprland-style macOS config
# =========================================================

config-version = 2

# ---------------------------------------------------------
# Layout
# ---------------------------------------------------------

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
automatically-unhide-macos-hidden-apps = true

# ---------------------------------------------------------
# Gaps (equivalent to gaps_in/gaps_out = 2)
# ---------------------------------------------------------

[gaps]
inner.horizontal = 2
inner.vertical = 2
outer.left = 2
outer.bottom = 2
outer.top = 2
outer.right = 2

# ---------------------------------------------------------
# Main bindings
# ---------------------------------------------------------

[mode.main.binding]

# --- Applications ---
alt-enter = 'exec-and-forget kitty'
alt-e     = 'exec-and-forget open -a Finder'
alt-b     = 'exec-and-forget open -a "Google Chrome"'

# Spotlight (Cmd+Space)
alt-d = '''
exec-and-forget osascript -e 'tell application "System Events" to key code 49 using {command down}'
'''

# Lock Screen (Ctrl+Cmd+Q)
alt-x = '''
exec-and-forget osascript -e 'tell application "System Events" to keystroke "q" using {control down, command down}'
'''

# Screenshot to clipboard
alt-shift-s = 'exec-and-forget screencapture -i -c'

# --- Window controls ---
alt-w = 'close'
alt-f = 'fullscreen'
alt-v = 'layout floating tiling'

# Change split orientation
alt-s = 'layout tiles horizontal vertical'

# Resize mode
alt-r = 'mode resize'

# --- Focus (vim keys) ---
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# --- Move windows (vim keys) ---
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# --- Workspaces ---
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

# --- Move window to workspace ---
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
alt-shift-0 = ['move-node-to-workspace 10', 'workspace 10']

# Quick workspace toggle
alt-tab = 'workspace-back-and-forth'

# ---------------------------------------------------------
# Resize mode
# ---------------------------------------------------------

[mode.resize.binding]

h = 'resize width -100'
l = 'resize width +100'
k = 'resize height -100'
j = 'resize height +100'

left  = 'resize width -100'
right = 'resize width +100'
up    = 'resize height -100'
down  = 'resize height +100'

enter  = 'mode main'
escape = 'mode main'

# ---------------------------------------------------------
# Optional app assignments
# ---------------------------------------------------------

[[on-window-detected]]
if.app-id = 'net.kovidgoyal.kitty'
run = ['move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = ['move-node-to-workspace 2']

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['move-node-to-workspace 3']
